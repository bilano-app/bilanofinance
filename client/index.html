<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BILANO - Smart Finance App</title>

    <link rel="manifest" href="/manifest.json" />
    
    <link rel="icon" type="image/png" href="/BILANO-ICON.png" />
    <link rel="apple-touch-icon" href="/BILANO-LOGO.jpg" />
    <link rel="apple-touch-startup-image" href="/BILANO-ICON.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#040814" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bilano.app/" />
    <meta property="og:title" content="BILANO - Smart Finance App" />
    <meta property="og:description" content="Kendalikan arus kas dan portofolio aset Anda dengan Asisten AI. Pengelola Keuangan Cerdas untuk kebebasan masa depan." />
    <meta property="og:image" content="https://placehold.co/1200x630/0a1128/fcd34d?text=BILANO+App" />

    <style>
      /* Reset dasar */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #040814;
        
        /* Mencegah pantulan (rubber-band) saat di-scroll mentok */
        overscroll-behavior-y: none; 
        
        /* Anti-Zoom tingkat dewa tanpa merusak layout mobile */
        touch-action: pan-x pan-y; 
        -webkit-text-size-adjust: 100%;
      }

      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Mencegah layar ter-block biru/abu saat ditekan lama */
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* Kembalikan fungsi seleksi HANYA pada inputan agar bisa ngetik */
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
        /* Mencegah Auto-Zoom iOS saat klik kolom input */
        font-size: 16px !important; 
      }
    </style>

    <script>
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { event.preventDefault(); }
        lastTouchEnd = now;
      }, false);
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "b45b3256-b290-4a98-b5fa-afa0501a6b1c", 
          safari_web_id: "", 
          notifyButton: { enable: false },
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
