    <style>
      /* Skala dasar normal */
      html {
        font-size: 16px;
      }

      /* Kunci body agar layar tidak ikut bergeser atau membal */
      html, body {
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background-color: #040814;
        overscroll-behavior-y: none; 
        
        /* 2. KUNCI MATI PINCH-TO-ZOOM DI ROOT */
        /* Hanya izinkan scroll atas-bawah/kiri-kanan, matikan cubitan (pinch) */
        touch-action: pan-x pan-y; 
        -webkit-text-size-adjust: 100%;
      }

      /* Container utama aplikasi */
      #root {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Turunkan sifat touch-action ke kontainer */
        touch-action: pan-x pan-y; 
      }
      
      /* Mencegah text terpilih tak sengaja yang bikin feel aplikasi web banget */
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* Kembalikan fungsi seleksi HANYA pada inputan */
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
        /* 3. Mencegah Auto-Zoom iOS saat klik kolom input */
        font-size: 16px !important; 
      }
    </style>

    <script>
      // Mencegah Pinch-to-Zoom di perangkat Apple/Safari
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });

      // Mencegah Double-Tap untuk Zoom yang sering aktif di Android/iOS
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>

    <script>
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite mendeteksi ada file update terbaru, melakukan Auto-Refresh...');
        event.preventDefault();
        window.location.reload(true);
      });
    </script>

    <script>
      function median_onesignal_info(info) {
          if (info && info.oneSignalUserId) {
              const idAntena = info.oneSignalUserId;
              const email = localStorage.getItem("bilano_email") || "guest";
              fetch('/api/user/onesignal', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-user-email': email },
                  body: JSON.stringify({ onesignalId: idAntena })
              }).then(() => {
                  console.log("✅ Antena Native Terhubung!");
              }).catch(err => console.error("Gagal lapor database", err));
          }
      }
    </script>
