    <style>
      /* 🚀 STANDARISASI UKURAN: Kunci skala dasar 14px universal agar tidak berubah saat 'Situs Desktop' aktif */
      html {
        font-size: 14px !important;
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
        -webkit-font-smoothing: antialiased;
      }

      /* Kunci ukuran agar tidak goyang atau membal (rubber-band effect) */
      html, body {
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background-color: #0b101b; /* Background elegan di sisi desktop */
        /* Mencegah tarikan refresh di Chrome/Safari */
        overscroll-behavior-y: none; 
        /* Mencegah zoom saat double tap */
        touch-action: manipulation; 
      }

      /* Buat container utama yang menangani scroll secara internal */
      #root {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch; /* Scroll halus di iPhone */
      }
      
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      /* 🛡️ PERLINDUNGAN GAMBAR & ELEMEN NATIVE: Matikan popup long-press browser (copy/download image) */
      img, svg, picture, video, canvas, [role="img"], a img, button img {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        -khtml-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
      }

      a, button, [role="button"] {
        -webkit-touch-callout: none !important;
      }
      
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
    </style>

    <script>
      // 🛡️ KUNCI ANTI PINCH-TO-ZOOM & GESTURE SCALING (Chrome & Safari)
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      // Mencegah multi-touch pinch to zoom di mobile
      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Mencegah Ctrl + Mouse Wheel zoom di Desktop
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // 🛡️ Blokir popup long-press bawaan Google/Browser untuk seluruh gambar, ikon, dan tautan
      window.addEventListener('contextmenu', function(e) {
        var target = e.target;
        if (!target) return;
        var isTextInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable;
        if (!isTextInput) {
          e.preventDefault();
          return false;
        }
      }, { capture: true, passive: false });

      window.addEventListener('dragstart', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'IMG' || target.tagName === 'SVG' || target.closest('img, svg'))) {
          e.preventDefault();
          return false;
        }
      }, { capture: true, passive: false });
    </script>

    <script>
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite mendeteksi ada file update terbaru, melakukan Auto-Refresh...');
        event.preventDefault();
        window.location.reload(true);
      });
    </script>

    <script>
      function median_onesignal_info(info) {
          if (info && info.oneSignalUserId) {
              const idAntena = info.oneSignalUserId;
              const email = localStorage.getItem("bilano_email") || "guest";
              fetch('/api/user/onesignal', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-user-email': email },
                  body: JSON.stringify({ onesignalId: idAntena })
              }).then(() => {
                  console.log("✅ Antena Native Terhubung!");
              }).catch(err => console.error("Gagal lapor database", err));
          }
      }
    </script>
